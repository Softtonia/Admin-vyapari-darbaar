name: Deploy Vyapari Darbaar Admin

on:
  push:
    branches:
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BASE_PATH: /var/www/admin.vyaparidarbar.com

concurrency:
  group: admin-vyaparidarbar-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy React/Vite Admin
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Code
        uses: actions/checkout@v5

      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # ============================================================
      # INSTALL
      # ============================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000

          INSTALL_SUCCESS=0

          if [ -f package-lock.json ]; then
            for i in 1 2 3; do
              echo "npm ci attempt $i"

              if npm ci --no-audit --no-fund; then
                INSTALL_SUCCESS=1
                break
              fi

              sleep 15
            done
          else
            for i in 1 2 3; do
              echo "npm install attempt $i"

              if npm install --no-audit --no-fund; then
                INSTALL_SUCCESS=1
                break
              fi

              sleep 15
            done
          fi

          if [ "$INSTALL_SUCCESS" -ne 1 ]; then
            echo "ERROR: npm dependency installation failed"
            exit 1
          fi

      # ============================================================
      # ENV
      #
      # IMPORTANT:
      # Change/add VITE_* variables according to your actual project.
      # ============================================================

      - name: Create Production Environment
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail

          rm -f .env.production

          {
            printf 'VITE_API_BASE_URL=%s\n' "$VITE_API_BASE_URL"
          } > .env.production

          echo "Production environment created"

          # Never print actual secret values
          sed 's/=.*/=***hidden***/' .env.production

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build React/Vite App
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dist

          npm run build

          if [ ! -d "dist" ]; then
            echo "ERROR: Vite dist directory not found"
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found"
            exit 1
          fi

          echo "Build successful"

      # ============================================================
      # ARCHIVE
      # ============================================================

      - name: Create Release Archive
        shell: bash
        run: |
          set -euo pipefail

          rm -f admin-build.tar.gz

          tar -czf admin-build.tar.gz -C dist .

          echo "Archive:"
          ls -lh admin-build.tar.gz

      # ============================================================
      # SSH
      # ============================================================

      - name: Configure SSH
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_PORT: ${{ secrets.DEV_PORT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DEV_SSH_KEY" ]; then
            echo "ERROR: DEV_SSH_KEY missing"
            exit 1
          fi

          if [ -z "$DEV_HOST" ]; then
            echo "ERROR: DEV_HOST missing"
            exit 1
          fi

          PORT="${DEV_PORT:-22}"

          echo "SSH_PORT=$PORT" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh

          printf '%s\n' "$DEV_SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            -p "$PORT" \
            -H "$DEV_HOST" \
            >> ~/.ssh/known_hosts

      # ============================================================
      # SERVER PREPARE
      # ============================================================

      - name: Prepare Server
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$DEV_USER@$DEV_HOST" \
            "
              set -e

              mkdir -p '$BASE_PATH/releases'
              mkdir -p '$BASE_PATH/.deploy_tmp'

              rm -f '$BASE_PATH/.deploy_tmp/admin-build.tar.gz'
            "

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Build
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
        shell: bash
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/deploy_key \
            -P "$SSH_PORT" \
            admin-build.tar.gz \
            "$DEV_USER@$DEV_HOST:$BASE_PATH/.deploy_tmp/admin-build.tar.gz"

      # ============================================================
      # RELEASE DEPLOYMENT
      # ============================================================

      - name: Deploy Release
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          RELEASE_ID: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$DEV_USER@$DEV_HOST" \
            "
              BASE_PATH='$BASE_PATH' \
              RELEASE_ID='$RELEASE_ID' \
              bash -s
            " << 'SERVER_SCRIPT'

          set -euo pipefail

          RELEASES_PATH="$BASE_PATH/releases"
          RELEASE_PATH="$RELEASES_PATH/$RELEASE_ID"
          CURRENT_PATH="$BASE_PATH/current"

          ARCHIVE_PATH="$BASE_PATH/.deploy_tmp/admin-build.tar.gz"

          echo "========================================"
          echo "Vyapari Darbaar Admin Deployment"
          echo "========================================"

          echo "Release: $RELEASE_ID"
          echo "Release path: $RELEASE_PATH"

          # --------------------------------------------------------
          # Validate archive
          # --------------------------------------------------------

          if [ ! -f "$ARCHIVE_PATH" ]; then
            echo "ERROR: Build archive not found"
            exit 1
          fi

          # --------------------------------------------------------
          # Prepare new release
          # --------------------------------------------------------

          rm -rf "$RELEASE_PATH"

          mkdir -p "$RELEASE_PATH"

          tar -xzf "$ARCHIVE_PATH" \
            -C "$RELEASE_PATH"

          # --------------------------------------------------------
          # Validate extracted release
          # --------------------------------------------------------

          if [ ! -f "$RELEASE_PATH/index.html" ]; then
            echo "ERROR: index.html missing from release"

            rm -rf "$RELEASE_PATH"

            exit 1
          fi

          # --------------------------------------------------------
          # Deployment metadata
          # --------------------------------------------------------

          printf '%s\n' "$RELEASE_ID" \
            > "$RELEASE_PATH/deploy-version.txt"

          date -u +"%Y-%m-%dT%H:%M:%SZ" \
            > "$RELEASE_PATH/deployed-at.txt"

          # --------------------------------------------------------
          # Permissions
          # --------------------------------------------------------

          find "$RELEASE_PATH" \
            -type d \
            -exec chmod 755 {} \;

          find "$RELEASE_PATH" \
            -type f \
            -exec chmod 644 {} \;

          # --------------------------------------------------------
          # Atomic release switch
          # --------------------------------------------------------

          ln -sfn \
            "$RELEASE_PATH" \
            "$BASE_PATH/current.new"

          mv -Tf \
            "$BASE_PATH/current.new" \
            "$CURRENT_PATH"

          echo "Current release switched"

          # --------------------------------------------------------
          # Cleanup archive
          # --------------------------------------------------------

          rm -f "$ARCHIVE_PATH"

          # --------------------------------------------------------
          # Keep latest 5 releases
          # --------------------------------------------------------

          echo "Cleaning old releases"

          CURRENT_TARGET="$(readlink -f "$CURRENT_PATH")"

          find "$RELEASES_PATH" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%T@ %p\n' \
            | sort -nr \
            | awk 'NR > 5 {print $2}' \
            | while read -r OLD_RELEASE; do

                if [ "$OLD_RELEASE" != "$CURRENT_TARGET" ]; then
                  echo "Removing: $OLD_RELEASE"
                  rm -rf "$OLD_RELEASE"
                fi

              done

          echo "========================================"
          echo "Deployment completed"
          echo "========================================"

          SERVER_SCRIPT

      # ============================================================
      # HEALTH CHECK
      # ============================================================

      - name: Production Health Check
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for deployment..."
          sleep 3

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --location \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 20 \
              https://admin.vyaparidarbar.com
          )"

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Production health check failed"
            exit 1
          fi

          echo "Production health check passed"

      # ============================================================
      # DEPLOY INFO
      # ============================================================

      - name: Deployment Summary
        run: |
          echo "========================================"
          echo "Vyapari Darbaar Admin deployed"
          echo "Commit: $GITHUB_SHA"
          echo "URL: https://admin.vyaparidarbar.com"
          echo "========================================"
